name: Docker Image CI

on:
  push:
    branches: [ master ]
  pull_request:

env:
  IMAGE: ghcr.io/larbreapages/larbreapages.fr

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: try Log in to GitHub Container Registry
        env:
            GHCR_USERNAME: lecureuil-code
            GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
            if [ -z "$GHCR_PAT" ]; then
              echo "GHCR_PAT is unavailable to this run"
              exit 1
            fi
            printf '%s' "$GHCR_PAT" | docker login ghcr.io \
              --username "$GHCR_USERNAME" \
              --password-stdin
      
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set short SHA
        # create a reproducible SHORT_SHA for this run and export it to subsequent steps
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Build the Docker image (tagged with short SHA and latest)
        run: docker build --build-arg PREFIX_PATHS=true -t $IMAGE:$SHORT_SHA -t $IMAGE:latest .

      - name: Push the Docker image tags
        run: |
          docker push $IMAGE:$SHORT_SHA
          docker push $IMAGE:latest

      - name: Deploy on docker swarm
        run: |
          curl -X POST ${{ secrets.PORTAINER_WEBHOOK_URL }}
